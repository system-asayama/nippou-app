services:
  web:
    build: .
    ports:
      - "${WEB_PORT:-8000}:8000"
    environment:
      DATABASE_URL: postgresql://app:app@db:5432/easy_login_system_app
      SECRET_KEY: ${SECRET_KEY:-dev-secret-change-me}
      # 管理者が 1 人も居ないときだけ使われる初期管理者（未設定なら /setup で作成）
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      SETUP_TOKEN: ${SETUP_TOKEN:-}
    depends_on:
      - db
    restart: unless-stopped
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: easy_login_system_app
    volumes:
      - db_data:/var/lib/postgresql/data
    restart: unless-stopped
volumes:
  db_data:
